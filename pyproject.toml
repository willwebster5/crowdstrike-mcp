[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "crowdstrike-mcp"
dynamic = ["version"]
description = "MCP server for the CrowdStrike Falcon platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "Will Webster" }]
keywords = ["crowdstrike", "falcon", "mcp", "security", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "crowdstrike-falconpy>=1.6.1",
    # Upper bound is deliberate. mcp 2.0.0 (2026-07-28) removed
    # mcp.server.fastmcp, which server.py and every module import — CI went from
    # green to "ModuleNotFoundError: No module named 'mcp.server.fastmcp'" at
    # collection time without a single source change, and stayed latently broken
    # until the next run happened to be a PR. An unpinned major means breakage
    # arrives on an upstream release schedule rather than on a commit, and lands
    # on whichever PR is open at the time.
    #
    # Verified 2026-08-11: the suite is green on 1.13.1 and on 1.29.0 (the latest
    # 1.x), and fails to import on 2.0.0. Adopting mcp 2.x is a real migration
    # and belongs in its own PR. Raise this bound as part of that work.
    "mcp>=1.12.1,<2",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "pyyaml>=6.0",
    # Direct dependency: the NGSIEM module bypasses falconpy for one specific
    # call (recovering the text/plain CQL diagnostic falconpy throws away).
    # falconpy already pulls requests in transitively, but an import we make
    # ourselves gets declared ourselves.
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0", "ruff>=0.8.0"]

[project.scripts]
crowdstrike-mcp = "crowdstrike_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdstrike_mcp"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/crowdstrike_mcp/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 155
select = ["E", "F", "I"]
